<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Completo</title>
    <link rel="stylesheet" href="./pseudo.css">
</head>

<body>

    <!-- ==============================
         SELECTOR DE IDIOMA
    ================================ -->
    <div class="lang-selector">
        <button onclick="translatePage('es')">ES</button>
        <button onclick="translatePage('en')">EN</button>
        <button onclick="translatePage('zh')">ZH</button>
        <button onclick="translatePage('ru')">RU</button>
    </div>

    <!-- ==============================
         FORMULARIO
    ================================ -->
    <form class="mi-formulario" id="formulario-registro">
        <h2 data-i18n="titulo">Registro</h2>

        <!-- NOMBRE -->
        <div class="campo-grupo contenedor-tarjeta" dir="ltr">
            <label for="nombre" data-i18n="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Escribe tu nombre" data-placeholder="nombre_placeholder" required>
        </div>

        <!-- CORREO -->
        <div class="campo-grupo contenedor-tarjeta" dir="ltr">
            <label for="email" data-i18n="email">Correo electrónico:</label>
            <input type="email" id="email" placeholder="correo@ejemplo.com" data-placeholder="email_placeholder" required>
        </div>

        <!-- CHECKBOX -->
        <div class="campo-grupo">
            <label class="opcion-check">
                <input type="checkbox">
                <span data-i18n="terminos">Acepto los términos y condiciones</span>
            </label>
        </div>

        <!-- RADIO BUTTONS -->
        <div class="campo-grupo">
            <p data-i18n="suscripcion">Selecciona tu suscripción:</p>
            <label class="opcion-radio">
                <input type="radio" name="plan" value="basico">
                <span data-i18n="basico">Básico</span>
            </label>
            <label class="opcion-radio">
                <input type="radio" name="plan" value="premium">
                <span data-i18n="premium">Premium</span>
            </label>
        </div>

        <!-- BOTÓN -->
        <button type="submit" class="btn-enviar" data-i18n="enviar">
            Enviar Datos
        </button>

        <!-- LINK :TARGET -->
        <div class="seccion-links">
            <p>
                <a href="#mensaje-exito" data-i18n="ver_mensaje">Ver mensaje de confirmación</a>
            </p>
        </div>
    </form>

    <!-- ==============================
         MENSAJE :TARGET
    ================================ -->
    <div id="mensaje-exito" class="seccion-target">
        <h3 data-i18n="target_titulo">¡Foco en el destino!</h3>
        <p data-i18n="target_texto">Has activado este elemento usando :target.</p>
        <a href="#" data-i18n="cerrar">Cerrar</a>
    </div>

    <!-- ==============================
         JAVASCRIPT EXTERNO
    ================================ -->
    <script src="./javapseudo.js"></script>

</body>

</html>
