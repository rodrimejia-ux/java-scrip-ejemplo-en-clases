<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triqui Neón 3D</title>
  <link rel="stylesheet" href="./estilo.css">
</head>
<body>

  <div class="container">
    <h1>TRIQUI NEÓN 3D</h1>

    <div class="scoreboard">
      <div class="score-card player-x">
        <span class="label">JUGADOR X</span>
        <span id="score-x" class="score-val">0</span>
      </div>
      <div class="score-card ties">
        <span class="label">EMPATES</span>
        <span id="score-ties" class="score-val">0</span>
      </div>
      <div class="score-card player-o">
        <span class="label">JUGADOR O</span>
        <span id="score-o" class="score-val">0</span>
      </div>
    </div>

    <div id="status">TURNO DE: <span id="current-player" class="neon-x">X</span></div>

    <div class="board-3d-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>

    <div class="controls">
      <button id="restart-btn" class="btn">REINICIAR PARTIDA</button>
      <button id="reset-stats-btn" class="btn btn-secondary">RESET ESTADÍSTICAS</button>
    </div>
  </div>

  <script src="./mecanica.js"></script>
</body>
</html>
