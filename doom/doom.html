<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Neón</title>
  <link rel="stylesheet" href="./graficos.css">
</head>
<body>

  <div class="game-container">
    <h1>SNAKE NEÓN</h1>

    <div class="scoreboard">
      <div class="score-box">
        <span class="label">PUNTOS</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-box">
        <span class="label">MÁXIMO</span>
        <span id="high-score" class="value">0</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div id="game-over-screen" class="overlay hidden">
        <h2>¡JUEGO TERMINADO!</h2>
        <button id="restart-btn" class="btn">JUGAR DE NUEVO</button>
      </div>
    </div>

    <p class="controls-hint">Usa las <b>Flechas</b> o <b>W / A / S / D</b> para moverte</p>
  </div>

  <script src="./mecanismos.js"></script>
</body>
</html>
